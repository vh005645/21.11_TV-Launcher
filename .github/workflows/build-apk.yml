name: Build TV Launcher APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # KHÔNG dùng android-actions/setup-android nữa.
      # Runner ubuntu-latest đã có sẵn Android SDK ở $ANDROID_HOME.
      # Chỉ cài thêm đúng 3 package còn tồn tại: platform-tools, platforms;android-35, build-tools;35.0.0
      # Lỗi cũ: packages: tools -> sdkmanager báo "Failed to find package 'tools'" -> exit code 1
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK (Linux, no Gradle, no .exe)
        run: |
          set -euo pipefail
          cd tv_launcher
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/35.0.0"
          PLAT="$SDK/platforms/android-35/android.jar"
          KEYSTORE="vn-hero-sign.jks"
          ALIAS="vnhero"
          PASS="android"

          echo "BT=$BT"
          ls -l "$BT/aapt2" "$BT/zipalign" "$PLAT" "$KEYSTORE"

          OUT=build
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"

          # 1. Compile + link resources
          LINK_RES=""
          if [ -d res ]; then
            mkdir -p "$OUT/compiled"
            "$BT/aapt2" compile --dir res -o "$OUT/compiled/res.zip"
            LINK_RES="$OUT/compiled/res.zip"
          fi
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$PLAT" --manifest AndroidManifest.xml $LINK_RES

          # 2. Compile Java
          find src -name "*.java" > "$OUT/sources.txt"
          javac --release 8 -Xlint:-options -cp "$PLAT" -d "$OUT/classes" @"$OUT/sources.txt"

          # 3. DEX
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 30 --lib "$PLAT" \
            --output "$OUT" $(find "$OUT/classes" -name "*.class")

          # 4. Nhúng classes.dex vào APK
          python3 - "$OUT" <<'PYEOF'
          import sys, zipfile, os
          out = sys.argv[1]
          src = os.path.join(out, "base.apk")
          dst = os.path.join(out, "unsigned.apk")
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  zout.writestr(item, zin.read(item.filename))
              zout.write(os.path.join(out, "classes.dex"), "classes.dex")
          PYEOF

          # 5. Align + sign
          "$BT/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          java -jar "$BT/lib/apksigner.jar" sign --ks "$KEYSTORE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/tvlauncher.apk" "$OUT/aligned.apk"
          java -jar "$BT/lib/apksigner.jar" verify "$OUT/tvlauncher.apk"
          ls -lh "$OUT/tvlauncher.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-apk
          path: tv_launcher/build/tvlauncher.apk
          if-no-files-found: error

      - name: Create Release (only on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tv_launcher/build/tvlauncher.apk
          generate_release_notes: true
