name: Build TV Launcher APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Repo của bạn trên GitHub KHÔNG có thư mục tv_launcher/ ở root
      # (file AndroidManifest.xml, src/, res/ nằm ngay ở root),
      # trong khi file zip gốc lại có tv_launcher/ bọc ngoài.
      # Bước này tự tìm đúng thư mục chứa AndroidManifest.xml để build,
      # chạy được cho cả 2 kiểu cấu trúc.
      - name: Detect app dir
        run: |
          echo "=== Repo layout (root) ==="
          ls -la
          echo "=== Tim AndroidManifest.xml ==="
          find . -maxdepth 3 -name "AndroidManifest.xml" -not -path "./.git/*" | head -n 20
          echo "=== Tim keystore ==="
          find . -maxdepth 3 -name "*.jks" -not -path "./.git/*" | head -n 20

          APP_DIR="."
          if [ -d tv_launcher ] && [ -f tv_launcher/AndroidManifest.xml ]; then
            APP_DIR="tv_launcher"
          elif [ -f AndroidManifest.xml ]; then
            APP_DIR="."
          else
            MANIFEST=$(find . -maxdepth 3 -name "AndroidManifest.xml" -not -path "./.git/*" | head -n 1)
            if [ -n "$MANIFEST" ]; then
              APP_DIR=$(dirname "$MANIFEST")
            fi
          fi

          # Chuẩn hoá: "." giữ nguyên, còn lại bỏ ./ ở đầu
          APP_DIR="${APP_DIR#./}"
          if [ -z "$APP_DIR" ]; then APP_DIR="."; fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Detected APP_DIR=$APP_DIR"
          ls -la "$APP_DIR"
          ls -la "$APP_DIR/src" 2>/dev/null || true

      - name: Build APK (Linux, no Gradle, no .exe)
        run: |
          set -euo pipefail
          echo "Building in APP_DIR=$APP_DIR"
          cd "$APP_DIR"
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/35.0.0"
          PLAT="$SDK/platforms/android-35/android.jar"

          # Tìm keystore: ưu tiên trong cùng thư mục app, rồi tới tv_launcher/, rồi root
          if [ -f "vn-hero-sign.jks" ]; then
            KEYSTORE="vn-hero-sign.jks"
          elif [ -f "../vn-hero-sign.jks" ]; then
            KEYSTORE="../vn-hero-sign.jks"
          elif [ -f "tv_launcher/vn-hero-sign.jks" ]; then
            KEYSTORE="tv_launcher/vn-hero-sign.jks"
          else
            echo "ERROR: khong tim thay vn-hero-sign.jks"
            find . .. -maxdepth 3 -name "*.jks" 2>/dev/null || true
            exit 1
          fi
          echo "KEYSTORE=$KEYSTORE"

          ALIAS="vnhero"
          PASS="android"

          ls -l "$BT/aapt2" "$BT/zipalign" "$PLAT" "$KEYSTORE"

          OUT=build
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"

          # 1. Compile + link resources
          LINK_RES=""
          if [ -d res ]; then
            mkdir -p "$OUT/compiled"
            "$BT/aapt2" compile --dir res -o "$OUT/compiled/res.zip"
            LINK_RES="$OUT/compiled/res.zip"
          fi
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$PLAT" --manifest AndroidManifest.xml $LINK_RES

          # 2. Compile Java
          find src -name "*.java" > "$OUT/sources.txt"
          javac --release 8 -Xlint:-options -cp "$PLAT" -d "$OUT/classes" @"$OUT/sources.txt"

          # 3. DEX
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 30 --lib "$PLAT" \
            --output "$OUT" $(find "$OUT/classes" -name "*.class")

          # 4. Nhúng classes.dex vào APK
          python3 - "$OUT" <<'PYEOF'
          import sys, zipfile, os
          out = sys.argv[1]
          src = os.path.join(out, "base.apk")
          dst = os.path.join(out, "unsigned.apk")
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  zout.writestr(item, zin.read(item.filename))
              zout.write(os.path.join(out, "classes.dex"), "classes.dex")
          PYEOF

          # 5. Align + sign
          "$BT/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          java -jar "$BT/lib/apksigner.jar" sign --ks "$KEYSTORE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/tvlauncher.apk" "$OUT/aligned.apk"
          java -jar "$BT/lib/apksigner.jar" verify "$OUT/tvlauncher.apk"
          ls -lh "$OUT/tvlauncher.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-apk
          path: ${{ env.APP_DIR }}/build/tvlauncher.apk
          if-no-files-found: error

      - name: Create Release (only on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/build/tvlauncher.apk
          generate_release_notes: true
