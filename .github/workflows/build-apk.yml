name: Build TV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tv_launcher

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check source layout
        run: |
          test -f AndroidManifest.xml
          test -d src
          test -d res
          test -f vn-hero-sign.jks
          find src -name '*.java' -print | sort

      - name: Configure Firebase URL (optional)
        if: ${{ secrets.FIREBASE_DB_URL != '' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('src/vn/herotran/launcher/RemoteConfig.java')
          s = p.read_text(encoding='utf-8')
          url = os.environ['FIREBASE_DB_URL'].strip().rstrip('/')
          s = s.replace(
              'https://YOUR-PROJECT-default-rtdb.firebaseio.com',
              url
          )
          p.write_text(s, encoding='utf-8')
          print('Firebase URL configured.')
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BT="$SDKMANAGER_ROOT/build-tools/35.0.0"
          PLAT="$SDKMANAGER_ROOT/platforms/android-35/android.jar"
          OUT="build"
          KEYSTORE="vn-hero-sign.jks"
          ALIAS="vnhero"
          PASS="android"

          rm -rf "$OUT"
          mkdir -p "$OUT/classes" "$OUT/compiled"

          echo "==> Compile resources"
          "$BT/aapt2" compile --dir res -o "$OUT/compiled/res.zip"

          echo "==> Link resources + manifest"
          "$BT/aapt2" link \
            -o "$OUT/base.apk" \
            -I "$PLAT" \
            --manifest AndroidManifest.xml \
            "$OUT/compiled/res.zip"

          echo "==> Compile Java"
          find src -name '*.java' -print | sort > "$OUT/sources.txt"
          javac --release 8 -Xlint:-options \
            -cp "$PLAT" \
            -d "$OUT/classes" \
            @"$OUT/sources.txt"
